# Release — on `git push` of a tag matching v*.*.*, build all 5 targets and
# publish them as a GitHub release with auto-generated release notes.
#
# To ship a release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# This workflow does the rest: builds darwin-arm64/amd64, linux-arm64/amd64/
# armv7 (all statically linked, CGO off), computes SHA-256 checksums, and
# uploads them all to the GitHub release. install.sh reads the "latest"
# release to fetch the right binary for the caller's OS/arch.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist as a git tag.'
        required: true

permissions:
  contents: write   # needed to create the release + upload assets

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe` (used by Makefile LDFLAGS to stamp
          # main.version) picks up the correct tag name.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all release targets
        run: make release

      - name: Compute SHA-256 checksums
        run: |
          cd bin
          sha256sum chorecoin-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            bin/chorecoin-*
            bin/SHA256SUMS.txt
          body: |
            ## Chore Coin ${{ github.event.inputs.tag || github.ref_name }}

            Single-binary distribution — no Docker, no Node, no external
            files needed at runtime. Just download the binary for your OS
            and architecture and run it.

            ### Easiest: download a launcher

            No commands to paste. Download, double-click, done.

            - **Mac:** [install-chorecoin-mac.command](https://chore-coin.app/download/install-chorecoin-mac.command)
            - **Windows:** [install-chorecoin-windows.bat](https://chore-coin.app/download/install-chorecoin-windows.bat)
            - **Raspberry Pi / Linux:** [install-chorecoin-pi.sh](https://chore-coin.app/download/install-chorecoin-pi.sh)

            See the [install guide](https://chore-coin.app/install-guide.html) for the click-past-the-security-warning walkthrough.

            ### Terminal one-liner (Mac + Linux)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/danielhemp/chore-coin/main/install.sh | \
              CHORECOIN_LICENSE=CHRC-XXXX-XXXX-XXXX-XXXX sh
            ```

            ### PowerShell one-liner (Windows)

            ```powershell
            $env:CHORECOIN_LICENSE = 'CHRC-XXXX-XXXX-XXXX-XXXX'
            iwr -UseBasicParsing https://raw.githubusercontent.com/danielhemp/chore-coin/main/install.ps1 | iex
            ```

            ### Manual binary download
            Pick the binary for your platform:

            | Platform | Binary |
            |---|---|
            | Apple Silicon Mac | `chorecoin-darwin-arm64` |
            | Intel Mac | `chorecoin-darwin-amd64` |
            | Linux x86_64 | `chorecoin-linux-amd64` |
            | Linux ARM64 (Pi 4/5/Zero 2W) | `chorecoin-linux-arm64` |
            | Linux ARM v7 (Pi 2/3/Zero W) | `chorecoin-linux-armv7` |
            | Windows x64 | `chorecoin-windows-amd64.exe` |
            | Windows ARM64 (Surface Pro X etc.) | `chorecoin-windows-arm64.exe` |

            All binaries are statically linked (no libc dependency) and
            include SHA-256 checksums in `SHA256SUMS.txt`.

            ### Run manually
            ```
            ./chorecoin serve --http=0.0.0.0:8090 --dir=/path/to/data
            ```
