upstream pocketbase {
  server pocketbase:8090;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Allow larger request/response bodies for realtime SSE + file uploads.
  client_max_body_size 20M;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # PocketBase REST API — reverse proxy to the backend container.
  location /api/ {
    proxy_pass http://pocketbase;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE endpoints (/api/realtime) — disable buffering and extend timeouts.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
  }

  # PocketBase admin UI at /_/.
  location /_/ {
    proxy_pass http://pocketbase;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback for the PWA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache the hashed bundle; short-cache the rest so PWA updates land quickly.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /sw.js {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Security headers (Cloudflare in front will layer more).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
